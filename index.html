<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TutOrg"/>
<meta name="theme-color" content="#1A2740"/>
<title>TutOrg</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0F1C2E;--card:rgba(255,255,255,.05);--navy:#FFFFFF;--accent:#E8703A;
  --accentL:rgba(232,112,58,.15);--green:#3DB868;--greenL:rgba(61,184,104,.15);
  --gold:#F0B429;--goldL:rgba(240,180,41,.15);--border:rgba(255,255,255,.08);--muted:rgba(255,255,255,.4);
  --card-shadow:0 2px 8px rgba(0,0,0,.3),0 8px 32px rgba(0,0,0,.4);
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);
  --sidebar-bg:linear-gradient(175deg,#0A1628 0%,#071020 100%);
  --content-bg:linear-gradient(160deg,#0F1C2E 0%,#0A1628 100%);
  --input-bg:rgba(255,255,255,.07);--input-color:#fff;
  --modal-bg:linear-gradient(170deg,#1A2E48 0%,#162236 100%);
  --modal-header-bg:rgba(22,34,54,.95);--modal-title:#fff;
  --sync-bg:rgba(255,255,255,.03);
  --prog-track:rgba(255,255,255,.08);
  --slot-bg:rgba(232,112,58,.08);
  --drop-bg:rgba(255,255,255,.03);--drop-border:rgba(255,255,255,.15);
  --text-primary:#ffffff;--text-muted:rgba(255,255,255,.4);
}
[data-theme="light"]{
  --bg:#F7F4F0;--card:#FFFFFF;--navy:#1A2740;--accent:#B5522A;
  color-scheme:light;
  --accentL:#F5E8E1;--green:#2E7D45;--greenL:#E3F5E8;
  --gold:#C49A2A;--goldL:#FEF3D0;--border:#EAE4DD;--muted:#8A8078;
  --card-shadow:0 1px 3px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.07);
  --sidebar-bg:linear-gradient(175deg,#1A2740 0%,#162236 100%);
  --content-bg:#F7F4F0;
  --input-bg:#ffffff;--input-color:var(--text-primary);
  --modal-bg:#ffffff;--modal-header-bg:rgba(255,255,255,.96);--modal-title:#1A2740;
  --sync-bg:linear-gradient(90deg,#0F1C2E,#1A2740);
  --prog-track:#EAE4DD;
  --slot-bg:#F5E8E1;--drop-bg:#F7F4F0;--drop-border:#EAE4DD;
  --text-primary:#1A2740;--text-muted:#8A8078;
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text-primary);color-scheme:dark;word-spacing:0.16em;}
[data-theme="light"] html,[data-theme="light"] body,body[data-theme="light"]{color-scheme:light;}
select option{background:#0F1C2E;color:#ffffff;}
[data-theme="light"] select option{background:#ffffff;color:var(--text-primary);}
#app{height:100%;display:flex;flex-direction:column;}

/* ── THEME TOGGLE ── */
.theme-toggle{display:flex;align-items:center;gap:6px;width:100%;padding:8px 12px;border-radius:10px;border:none;cursor:pointer;font-size:12px;font-family:inherit;background:rgba(255,255,255,.05);color:rgba(255,255,255,.4);font-weight:600;margin-bottom:6px;transition:all .15s;}
.theme-toggle:hover{background:rgba(255,255,255,.09);color:rgba(255,255,255,.7);}
.toggle-track{width:36px;height:20px;border-radius:10px;background:rgba(255,255,255,.15);position:relative;margin-left:auto;transition:background .2s;flex-shrink:0;}
.toggle-thumb{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform .2s;box-shadow:0 1px 4px rgba(0,0,0,.3);}
[data-theme="light"] .toggle-track{background:var(--accent);}
[data-theme="light"] .toggle-thumb{transform:translateX(16px);}


/* ── AUTH ── */
#auth-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#1A2740 60%,#2C3E55 100%);padding:40px 24px;position:relative;overflow:hidden;}
.auth-ring{position:absolute;border-radius:50%;border:1px solid rgba(255,255,255,.05);}
.auth-logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,var(--accent),#D4713F);display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:20px;box-shadow:0 8px 32px rgba(181,82,42,.5),0 2px 8px rgba(0,0,0,.3);z-index:1;}
.auth-title{font-size:28px;font-weight:800;color:#fff;letter-spacing:-.03em;margin-bottom:4px;z-index:1;}
.auth-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:40px;text-align:center;z-index:1;letter-spacing:.01em;}
.auth-form{width:100%;max-width:320px;z-index:1;display:flex;flex-direction:column;gap:10px;}
.auth-label{font-size:10px;font-weight:700;color:rgba(255,255,255,.45);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;display:block;}
.auth-input{width:100%;padding:14px 16px;border-radius:13px;border:1.5px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;font-size:16px;font-family:inherit;outline:none;-webkit-appearance:none;display:block;transition:border .2s,background .2s;}
.auth-input::placeholder{color:rgba(255,255,255,.25);}
.auth-input:focus{border-color:rgba(181,82,42,.7);background:rgba(255,255,255,.1);}
.auth-btn{width:100%;padding:15px;border-radius:13px;border:none;background:linear-gradient(135deg,#C4623A,var(--accent));color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:2px;box-shadow:0 4px 20px rgba(181,82,42,.5);letter-spacing:.02em;transition:transform .15s,box-shadow .15s;}
.auth-btn.secondary{background:rgba(255,255,255,.1);box-shadow:none;margin-top:0;}
.auth-google{width:100%;padding:13px;border-radius:11px;border:none;background:#fff;color:#1f1f1f;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.2);letter-spacing:.01em;}
.auth-google:active{opacity:.88;transform:scale(.98);}
.auth-divider{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.22);font-size:11px;letter-spacing:.05em;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.1);}
.auth-note{font-size:11px;color:rgba(255,255,255,.25);text-align:center;line-height:1.65;margin-top:4px;}
.auth-success{background:rgba(46,125,69,.2);border:1px solid rgba(46,125,69,.35);border-radius:14px;padding:18px;color:#fff;font-size:13px;text-align:center;line-height:1.75;white-space:pre-line;}

/* ── LAYOUT ── */
#main-app{flex:1;display:flex;overflow:auto;padding-top:var(--safe-top);}
#sidebar{width:220px;background:var(--sidebar-bg);display:flex;flex-direction:column;flex-shrink:0;padding-left:var(--safe-left);overflow-y:auto;border-right:1px solid rgba(255,255,255,.06);}
.sb-header{padding:28px 20px 20px;}
.sb-brand{display:none;}
.sb-title{font-size:22px;color:#fff;font-weight:900;letter-spacing:-.04em;display:flex;align-items:center;gap:8px;}
.sb-title::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;box-shadow:0 0 8px rgba(181,82,42,.8);}
.sb-user{font-size:11px;color:rgba(255,255,255,.28);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:16px;}
nav{padding:6px 12px;flex:1;}
.nav-section{font-size:9px;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.18em;font-weight:700;padding:12px 8px 4px;}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:12px;border:none;cursor:pointer;font-size:13px;font-family:inherit;margin-bottom:2px;background:transparent;color:rgba(255,255,255,.5);font-weight:500;transition:all .18s;text-align:left;position:relative;}
.nav-btn:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.85);}
.nav-btn.active{background:linear-gradient(135deg,rgba(181,82,42,.9),rgba(176,74,34,.8));color:#fff;font-weight:700;box-shadow:0 4px 12px rgba(181,82,42,.35);}
.nav-btn.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;border-radius:0 3px 3px 0;background:#fff;opacity:.6;}
.nav-btn:active{transform:scale(.97);}
.nav-icon{font-size:16px;width:20px;text-align:center;flex-shrink:0;}
.sb-footer{padding:12px;border-top:1px solid rgba(255,255,255,.06);padding-bottom:calc(12px + var(--safe-bottom));}
.sb-signout{display:flex;align-items:center;gap:8px;width:100%;padding:9px 12px;border-radius:10px;border:none;cursor:pointer;font-size:12px;font-family:inherit;background:rgba(255,255,255,.05);color:rgba(255,255,255,.35);font-weight:600;margin-bottom:6px;transition:all .15s;}
.sb-signout:hover{background:rgba(255,255,255,.09);color:rgba(255,255,255,.6);}
.sb-count{font-size:10px;color:rgba(255,255,255,.18);padding-left:2px;margin-top:4px;}
#content{flex:1;overflow:hidden;display:flex;flex-direction:column;padding-right:var(--safe-right);background:var(--content-bg);}
.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:28px 24px;padding-bottom:calc(48px + var(--safe-bottom));}
.page-wb{flex:1;overflow:hidden;display:flex;flex-direction:column;}

/* ── SYNC BAR ── */
.sync-bar{height:28px;background:var(--sync-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:6px;font-size:10px;color:rgba(255,255,255,.3);flex-shrink:0;letter-spacing:.06em;text-transform:uppercase;font-weight:600;}
.sync-dot{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px rgba(46,125,69,.8);}
.sync-dot.pulsing{background:var(--gold);animation:pulse 1s infinite;box-shadow:0 0 6px rgba(196,154,42,.8);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

/* ── CARDS ── */
.card{background:var(--card);backdrop-filter:blur(12px);border-radius:18px;padding:22px 22px;box-shadow:0 2px 8px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);margin-bottom:16px;transition:box-shadow .2s,transform .2s;}
.card:hover{box-shadow:0 4px 20px rgba(0,0,0,.4);}
.card:last-child{margin-bottom:0;}

/* ── BADGES ── */
.badge{border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:3px;letter-spacing:.02em;border:1px solid rgba(255,255,255,.08);}

/* ── BUTTONS ── */
.btn{cursor:pointer;border-radius:10px;font-weight:700;font-family:inherit;transition:all .16s;border:none;-webkit-appearance:none;letter-spacing:.01em;}
.btn:active{transform:scale(.96);opacity:.88;}
.btn-primary{background:linear-gradient(135deg,#E8703A,#C4623A);color:#fff;box-shadow:0 4px 16px rgba(232,112,58,.4);}
.btn-ghost{background:rgba(232,112,58,.1);color:#E8703A;border:1.5px solid rgba(232,112,58,.3)!important;}
.btn-ghost:hover{background:rgba(232,112,58,.18);}
.btn-danger{background:rgba(192,57,43,.15);color:#FF6B6B;border:1.5px solid rgba(192,57,43,.3)!important;}
.btn-danger:hover{background:rgba(192,57,43,.22);}
.btn-green{background:linear-gradient(135deg,#3DB868,#2E9B55);color:#fff;box-shadow:0 4px 16px rgba(61,184,104,.3);}
.btn-sm{padding:8px 16px;font-size:12px;border-radius:9px;}
.btn-md{padding:11px 22px;font-size:13px;}

/* ── FIELDS ── */
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;display:block;}
.field input,.field select,.field textarea{border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:15px;font-family:inherit;outline:none;background:var(--input-bg);width:100%;-webkit-appearance:none;transition:border-color .15s,box-shadow .15s;color:var(--input-color);}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#E8703A;box-shadow:0 0 0 3px rgba(232,112,58,.2);background:rgba(255,255,255,.1);}
.field textarea{resize:vertical;font-size:14px;line-height:1.65;}

/* ── MODAL ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(7,16,32,.75);z-index:3000;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);}
.modal-sheet{background:var(--modal-bg);border-radius:26px 26px 0 0;width:100%;max-height:93vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:var(--safe-bottom);animation:slideUp .26s cubic-bezier(.22,1,.36,1);border-top:1px solid rgba(255,255,255,.1);}
@keyframes slideUp{from{transform:translateY(100%);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:40px;height:4px;border-radius:2px;background:var(--border);margin:12px auto 0;flex-shrink:0;}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--modal-header-bg);backdrop-filter:blur(12px);z-index:1;}
.modal-header h3{margin:0;font-size:17px;color:var(--modal-title);font-weight:800;letter-spacing:-.02em;}
.modal-close{border:none;background:rgba(128,128,128,.15);border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;line-height:1;transition:background .15s;}
.modal-close:hover{background:rgba(128,128,128,.25);color:var(--text-primary);}
.modal-body{padding:20px 22px;display:grid;gap:16px;color:var(--text-primary);}
.modal-full{max-height:96vh;height:96vh;display:flex;flex-direction:column;}
.modal-full .modal-body{flex:1;overflow:hidden;padding:0;display:flex;flex-direction:column;}

/* ── GRIDS ── */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
.stat-card{background:var(--card);border-radius:18px;padding:22px 18px;text-align:center;border:1px solid rgba(255,255,255,.08);box-shadow:0 2px 12px rgba(0,0,0,.3);position:relative;overflow:hidden;backdrop-filter:blur(8px);}
.stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#D4713F);opacity:0;transition:opacity .2s;}
.stat-card:hover::after{opacity:1;}
.stat-val{font-size:26px;font-weight:900;letter-spacing:-.03em;margin-bottom:4px;}
.stat-lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}

/* ── PAGE HEADER ── */
.page-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:24px;color:var(--text-primary);font-weight:900;margin:0;letter-spacing:-.03em;}

/* ── PROGRESS ── */
.prog-row{margin-bottom:14px;}
.prog-labels{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;font-weight:600;}
.prog-track{height:7px;background:var(--prog-track);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.34,1.2,.64,1);}

/* ── MISC ── */
.slot-pill{background:var(--slot-bg);border-radius:12px;padding:10px 14px;margin-bottom:8px;font-size:13px;border:1px solid rgba(181,82,42,.15);}
.day-hdr{font-weight:800;font-size:9px;color:var(--accent);text-transform:uppercase;letter-spacing:.18em;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.day-hdr::after{content:'';}
.drop-zone{border:2px dashed var(--drop-border);border-radius:12px;padding:24px;text-align:center;cursor:pointer;background:var(--drop-bg);transition:all .2s;}
.drop-zone:hover{border-color:#E8703A;background:rgba(232,112,58,.1);}
.drop-zone.has-file{border-color:#3DB868;background:rgba(61,184,104,.1);}
.ann-toolbar{display:flex;gap:5px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;flex-shrink:0;}
.ann-btn{border:1.5px solid var(--border);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:var(--muted);font-family:inherit;transition:all .15s;}
.ann-btn.active{border-color:var(--accent);background:var(--accentL);color:var(--accent);}
.ann-body{flex:1;display:flex;overflow:hidden;min-height:0;height:100%;}
.ann-doc{flex:1;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#DDD8D0;min-height:0;height:100%;}
.ann-notes-panel{width:0;overflow:hidden;border-left:1px solid var(--border);display:flex;flex-direction:column;background:#fff;transition:width .2s;flex-shrink:0;}
.ann-notes-panel.open{width:200px;}
.ann-notes-lbl{padding:10px 12px;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;flex-shrink:0;}
.ann-notes-ta{flex:1;border:none;padding:12px;font-size:13px;font-family:inherit;resize:none;outline:none;color:var(--text-primary);line-height:1.65;width:100%;height:100%;-webkit-overflow-scrolling:touch;}
.wb-toolbar{display:flex;gap:4px;padding:8px 10px;background:var(--navy);flex-wrap:wrap;align-items:center;flex-shrink:0;}
.wb-btn{border:1.5px solid rgba(255,255,255,.18);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;background:transparent;color:rgba(255,255,255,.8);font-family:inherit;font-weight:700;transition:all .15s;}
.wb-btn.active{border-color:rgba(255,255,255,.8);background:rgba(255,255,255,.15);color:#fff;}
.wb-dot{width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.2);cursor:pointer;flex-shrink:0;transition:transform .1s;}
.wb-dot.active{border:3px solid rgba(255,255,255,.9);box-shadow:0 0 0 2px rgba(0,0,0,.3);transform:scale(1.15);}
.wb-sz{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;border:1.5px solid rgba(255,255,255,.18);color:#fff;font-weight:900;}
.wb-sz.active{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.8);}
#wb-wrap{flex:1;position:relative;overflow:hidden;background:#C8C3BB;touch-action:none;}
#wb-canvas{width:100%;height:100%;cursor:crosshair;display:block;touch-action:none;}
input[type=color]{-webkit-appearance:none;appearance:none;padding:0;border:none;background:none;overflow:hidden;box-sizing:border-box;}
input[type=color]::-webkit-color-swatch-wrapper{padding:0;border-radius:50%;overflow:hidden;}
input[type=color]::-webkit-color-swatch{border:none;border-radius:50%;}
input[type=color]::-moz-color-swatch{border:none;border-radius:50%;}
input[type=color]::-moz-focus-inner{padding:0;border:0;}
@media(max-width:480px){
  .wb-lefttoolbar-mobile{left:8px !important;}
  .wb-stylepanel-mobile{left:54px !important;min-width:0 !important;padding:12px !important;}
}
.wb-text-box{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px;z-index:10;min-width:280px;max-width:340px;}
.msg-pre{background:var(--card);border-radius:12px;padding:16px;font-size:13px;white-space:pre-wrap;font-family:inherit;line-height:1.8;color:var(--text-primary);max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border:1px solid rgba(255,255,255,.08);}
.info-box{padding:12px 16px;border-radius:10px;font-size:12px;line-height:1.7;border:1px solid var(--border);background:var(--card);color:var(--muted);}
.rates-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
@media(max-width:480px){
  #sidebar{width:58px;}
  .sb-title,.sb-brand,.sb-user,.nav-label,.sb-count{display:none;}
  .sb-header{padding:20px 8px 12px;}
  .nav-btn{justify-content:center;padding:13px 0;border-radius:12px;}
  .sb-signout span{display:none;}
  .grid-stats{grid-template-columns:1fr 1fr;}
  .page{padding:20px 16px;padding-bottom:calc(40px + var(--safe-bottom));}
  .card{padding:18px 16px;}
  .page-title{font-size:20px;}
}
@media(min-width:900px){
  .grid-stats{grid-template-columns:repeat(4,1fr);}
  #sidebar{width:230px;}
}
</style>
</head>
<body>
<div id="app">
  <div id="auth-screen" style="display:none"></div>
  <div id="main-app" style="display:none"></div>
</div>
<div id="modal-root"></div>
<script>
'use strict';
// CONFIG
// Apply saved theme immediately on load
(function(){
  var t=localStorage.getItem('tutorg-theme');
  if(t==='light'){
    document.documentElement.setAttribute('data-theme','light');
    document.body.setAttribute('data-theme','light');
  }
})();

const DEFAULT_RATES={8:{'1-4':3000,'5-8':3500,'9-12':4000},12:{'1-4':4000,'5-8':4500,'9-12':5400},16:{'1-4':5000,'5-8':5500,'9-12':6700},20:{'1-4':6000,'5-8':6500,'9-12':8000}};
function gradeKey(g,rt){
  // With new structure, find the band whose label/key matches grade number
  var n=parseInt(g);
  if(rt&&rt.bands){
    // Try to match by key range e.g. '1-4'
    for(var i=0;i<rt.bands.length;i++){
      var parts=rt.bands[i].key.split('-');
      if(parts.length===2&&n>=parseInt(parts[0])&&n<=parseInt(parts[1]))return rt.bands[i].key;
    }
    return rt.bands[rt.bands.length-1]?rt.bands[rt.bands.length-1].key:'9-12';
  }
  if(n>=1&&n<=4)return'1-4';if(n>=5&&n<=8)return'5-8';return'9-12';
}
function getRate(rt,sessions,gradeNum,isFamily,familyRate){
  if(isFamily&&familyRate)return Number(familyRate);
  // Support both old flat structure and new {tierSessions,bands,rates} structure
  var rates=rt.rates||rt;
  var tiers=rt.tierSessions||[8,12,16,20];
  var gk=gradeKey(gradeNum,rt);
  var rate=(rates[tiers[0]]&&rates[tiers[0]][gk])||3000;
  for(var i=0;i<tiers.length;i++){var t=tiers[i];if(sessions>=t&&rates[t]&&rates[t][gk])rate=rates[t][gk];}
  return rate;
}
function sessionCost(rate,duration){
  // rate is per 60 min; scale proportionally to actual duration
  return Math.round(rate*(duration||60)/60);
}

var UNITLESS_CSS_PROPS={opacity:1,zIndex:1,fontWeight:1,lineHeight:1,flex:1,flexGrow:1,flexShrink:1,order:1,zoom:1,columnCount:1,gridColumn:1,gridRow:1,gridColumnStart:1,gridColumnEnd:1,gridRowStart:1,gridRowEnd:1,tabSize:1,widows:1,orphans:1,animationIterationCount:1,scale:1,aspectRatio:1};
function el(tag,attrs){
  var e=document.createElement(tag);
  var children=Array.prototype.slice.call(arguments,2);
  if(attrs){
    Object.keys(attrs).forEach(function(k){
      var v=attrs[k];
      if(k==='style'&&typeof v==='object'){
        var sv={};
        Object.keys(v).forEach(function(sk){
          var val=v[sk];
          if(typeof val==='number'&&!UNITLESS_CSS_PROPS[sk])val=val+'px';
          sv[sk]=val;
        });
        Object.assign(e.style,sv);
      }
      else if(k.indexOf('on')===0&&typeof v==='function'){e.addEventListener(k.slice(2).toLowerCase(),v);}
      else if(k==='className'){e.className=v;}
      else{e.setAttribute(k,v);}

  }
  children.forEach(function(c){if(c==null||c===false)return;e.appendChild(typeof c==='string'?document.createTextNode(c):c);});

async function bootApp(){
  document.getElementById('auth-screen').style.display='none';
  document.getElementById('main-app').style.display='flex';
  await loadCloud();

  // ── SUBSCRIPTION CHECK ──
  // Get email from all possible sources
  var userEmail=(S.user&&(S.user.email||S.user.user_email))||
    (supa.tok&&JSON.parse(atob(supa.tok.split('.')[1])).email)||'';
  if(!S.user)S.user={};
  S.user.email=userEmail;
  var isAdmin=userEmail.toLowerCase().trim()===ADMIN_EMAIL.toLowerCase().trim();

  var sub=await supa.getSub();
  var isNewSub=false;
  if(!sub){
    isNewSub=true;
    await supa.createSub();
    sub={status:'trial',trial_start:new Date().toISOString(),trial_end:new Date(Date.now()+TRIAL_DAYS*24*60*60*1000).toISOString(),paid_until:null};
  }

  var now=new Date();
  var trialEnd=new Date(sub.trial_end);
  var paidUntil=sub.paid_until?new Date(sub.paid_until):null;
  var hasAccess=isAdmin||
    (sub.status==='trial'&&now<trialEnd)||
    (sub.status==='active'&&paidUntil&&now<paidUntil);
  var daysLeft=null;
  if(sub.status==='trial'&&now<trialEnd){
    daysLeft=Math.ceil((trialEnd-now)/(1000*60*60*24));
  } else if(sub.status==='active'&&paidUntil&&now<paidUntil){
    daysLeft=Math.ceil((paidUntil-now)/(1000*60*60*24));
  }
  S.subscription={sub:sub,hasAccess:hasAccess,daysLeft:daysLeft,isAdmin:isAdmin,email:userEmail};

  if(!hasAccess&&!isAdmin){showPaywall(sub);return;}

    renderApp();
}

async function init(){
  document.getElementById('auth-screen').style.display='flex';
  renderAuth();
  // Check if returning from Google OAuth (URL has #access_token)
  var oauthDone=await supa.handleOAuthCallback();
  if(oauthDone){await bootApp();return;}
  // Check existing session
  var session=await supa.getSession();
  if(session){S.user=session.user||session;await bootApp();}
}

// SCHEDULE
function pgSchedule(){
  var pg=el('div',{className:'page'});
  var top=el('div',{className:'page-top'});
  top.appendChild(el('h2',{className:'page-title'},'Weekly Schedule'));
  top.appendChild(mkBtn('+ Add Slot','btn-primary','btn-sm',function(){openScheduleModal();}));
  pg.appendChild(top);
  DAYS.forEach(function(day,di){
    var slots=S.schedule.filter(function(s){return s.day===di;}).sort(function(a,b){return a.time.localeCompare(b.time);});
    var dHdr=el('div',{className:'day-hdr',style:{display:'flex',justifyContent:'space-between',alignItems:'center'}});
    dHdr.appendChild(el('span',{},day));
    if(slots.length){
      var copyBtn=el('button',{title:'Copy this day\'s schedule',style:{
        border:'1px solid var(--border)',background:'var(--input-bg)',color:'var(--muted)',
        borderRadius:8,padding:'3px 10px',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'inherit'
      }},'📋 Copy');
      copyBtn.addEventListener('click',function(){
        var lines=slots.map(function(slot){
          var stu=S.students.find(function(s){return s.id===slot.studentId;});
          return slot.time+' — '+(stu?stu.name:'?')+(slot.note?' ('+slot.note+')':'');
        });
        var text=day+'\'s Schedule:\n\n'+lines.join('\n');
        if(navigator.clipboard)navigator.clipboard.writeText(text);
        showToast(day+'\'s schedule copied!');
      });
      dHdr.appendChild(copyBtn);
    }
    var dc=mkCard(dHdr);
    if(!slots.length)dc.appendChild(el('div',{style:{color:'var(--muted)',fontSize:12}},'Free'));
    slots.forEach(function(slot){
      var stu=S.students.find(function(s){return s.id===slot.studentId;});
      var pill=el('div',{className:'slot-pill'});
      var pr=el('div',{style:{display:'flex',justifyContent:'space-between'}});
      pr.appendChild(el('strong',{style:{color:'var(--text-primary)'}},slot.time));
      var db=el('button',{style:{border:'none',background:'none',cursor:'pointer',color:'var(--muted)',fontSize:14}},'x');
      (function(sid_){db.addEventListener('click',function(){mutate('schedule',function(arr){var i=arr.findIndex(function(x){return x.id===sid_;});if(i>-1)arr.splice(i,1);});});})(slot.id);
      pr.appendChild(db);pill.appendChild(pr);
      pill.appendChild(el('div',{style:{color:'var(--text-primary)',fontWeight:600}},stu?stu.name:'?'));
      if(slot.note)pill.appendChild(el('div',{style:{color:'var(--muted)',fontSize:11}},slot.note));
      if(!slot.recurring)pill.appendChild(bdg('One-time','var(--gold)','var(--goldL)'));
      dc.appendChild(pill);
    });
    pg.appendChild(dc);
  });
  return pg;
}

function openScheduleModal(){
  var form={studentId:'',time:'10:00',note:'',recurring:true};
  var selectedDays=[];
  var allDaysMode=true;

  var stuS=mkSel(form.studentId,[['','Select student...']].concat(S.students.map(function(s){return[s.id,s.name];})),function(v){form.studentId=v;});
  var timeI=mkInp('time',form.time,function(v){form.time=v;});
  var noteI=mkInp('text',form.note,function(v){form.note=v;},'e.g. Exam season extra');

  // Mode toggle: All days OR Select days
  var modeRow=el('div',{style:{display:'flex',gap:0,borderRadius:10,overflow:'hidden',border:'1.5px solid var(--border)',width:'fit-content',marginBottom:10}});
  ['Every Day','Select Days'].forEach(function(lbl,idx){
    var btn=el('button',{style:{
      padding:'8px 18px',border:'none',cursor:'pointer',fontWeight:700,
      fontSize:12,fontFamily:'inherit',transition:'all .2s',
      background:idx===0?'var(--accent)':'var(--input-bg)',
      color:idx===0?'#fff':'var(--muted)'
    }},lbl);
    btn.addEventListener('click',function(){
      allDaysMode=idx===0;
      modeRow.querySelectorAll('button').forEach(function(b,i){
        b.style.background=i===idx?'var(--accent)':'var(--input-bg)';
        b.style.color=i===idx?'#fff':'var(--muted)';
      });
      dayGrid.style.display=allDaysMode?'none':'grid';
    });
    modeRow.appendChild(btn);
  });

  // Day selector grid
  var dayGrid=el('div',{style:{display:'none',gridTemplateColumns:'repeat(4,1fr)',gap:6,marginTop:4}});
  DAYS.forEach(function(dayName,dayIdx){
    if(dayIdx===0)return; // skip Sunday index 0, show at end
    var chip=el('button',{style:{
      padding:'7px 4px',borderRadius:9,border:'1.5px solid var(--border)',
      fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit',
      background:'var(--input-bg)',color:'var(--muted)',transition:'all .15s'
    }},dayName.slice(0,3));
    chip.addEventListener('click',function(){
      var i=selectedDays.indexOf(dayIdx);
      if(i>=0){selectedDays.splice(i,1);chip.style.background='#fff';chip.style.color='var(--muted)';chip.style.borderColor='var(--border)';}
      else{selectedDays.push(dayIdx);chip.style.background='var(--accent)';chip.style.color='#fff';chip.style.borderColor='var(--accent)';}
    });
    dayGrid.appendChild(chip);
  });
  // Sunday last
  var sunChip=el('button',{style:{padding:'7px 4px',borderRadius:9,border:'1.5px solid var(--border)',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:'inherit',background:'var(--input-bg)',color:'var(--muted)'}},DAYS[0].slice(0,3));
  sunChip.addEventListener('click',function(){
    var i=selectedDays.indexOf(0);
    if(i>=0){selectedDays.splice(i,1);sunChip.style.background='#fff';sunChip.style.color='var(--muted)';}
    else{selectedDays.push(0);sunChip.style.background='var(--accent)';sunChip.style.color='#fff';}
  });
  dayGrid.appendChild(sunChip);

  var recChk=el('input',{type:'checkbox'});recChk.checked=true;
  recChk.addEventListener('change',function(){form.recurring=recChk.checked;});

  var body=el('div',{style:{display:'grid',gap:16}});
  body.appendChild(fld('Student',stuS));
  body.appendChild(fld('Frequency',modeRow));
  body.appendChild(dayGrid);
  body.appendChild(fld('Time',timeI));
  body.appendChild(fld('Note (optional)',noteI));
  body.appendChild(el('div',{style:{display:'flex',alignItems:'center',gap:10}},recChk,el('label',{style:{fontSize:13}},'Recurring weekly')));
  var btns=el('div',{style:{display:'flex',gap:10,justifyContent:'flex-end'}});
  btns.appendChild(mkBtn('Cancel','btn-ghost','btn-sm',closeModal));
  btns.appendChild(mkBtn('Add Slot','btn-primary','btn-sm',function(){
    if(!form.studentId){showToast('Please select a student');return;}
    // If allDaysMode, add one slot per day of week (Mon–Fri by default, or all 7)
    var daysToAdd=allDaysMode?[1,2,3,4,5,6,0]:selectedDays;
    if(!allDaysMode&&!daysToAdd.length){showToast('Please select at least one day');return;}
    mutate('schedule',function(arr){
      daysToAdd.forEach(function(d){
        arr.push({id:genId(),studentId:form.studentId,day:d,time:form.time,note:form.note,recurring:form.recurring});
      });
    });
    closeModal();
  }));
  body.appendChild(btns);
  showModal('Add Schedule Slot',body);
}

// BILLING
function pgBilling(){
  var month=NOW.getMonth(),year=NOW.getFullYear();
  var pg=el('div',{className:'page'});
  function render_(){
    pg.innerHTML='';
    var top=el('div',{className:'page-top'});
    top.appendChild(el('h2',{className:'page-title'},'Billing'));
    var ctrl=el('div',{style:{display:'flex',gap:6,alignItems:'center'}});
    ctrl.appendChild(mkSel(month,MONTHS.map(function(m,i){return[i,m];}),function(v){month=Number(v);render_();}));
    var yI=mkInp('number',year,function(v){year=Number(v);render_();},'');yI.style.width='72px';
    ctrl.appendChild(yI);top.appendChild(ctrl);pg.appendChild(top);
    var ML=MONTHS[month]+' '+year;
    var bills=S.students.map(function(stu){
      var ss=S.sessions.filter(function(s){var d=new Date(s.date);return s.studentId===stu.id&&d.getMonth()===month&&d.getFullYear()===year;});
      var count=ss.length,rate=getRate(S.rateTable,count,stu.gradeNum,stu.isFamily,stu.familyRate);
      var isMonthly=stu.billingMode==='monthly'&&stu.monthlyRate;
      var total=isMonthly?Number(stu.monthlyRate):ss.reduce(function(sum,s){return sum+sessionCost(rate,s.duration);},0);
      var rateLabel=isMonthly?'Flat Monthly':'Rs.'+rate+'/hr';
      return{stu:stu,count:count,rate:rate,total:total,ss:ss,isMonthly:!!(stu.billingMode==='monthly'&&stu.monthlyRate)};
    }).filter(function(b){return b.count>0||(b.stu.billingMode==='monthly'&&b.stu.monthlyRate);});
    if(!bills.length){pg.appendChild(el('div',{style:{color:'var(--muted)',textAlign:'center',padding:40}},'No sessions for '+ML));return;}
    bills.forEach(function(b){
      var sessionLines=b.isMonthly?'Billing mode: Flat monthly rate':b.ss.map(function(s){return new Date(s.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' ('+s.duration+'min) - Rs.'+sessionCost(b.rate,s.duration);}).join('\n');
      var rateNote=b.isMonthly?'Flat monthly rate: Rs.'+b.total:'Rate: Rs.'+b.rate+'/hr';
      var msgText='Dear '+b.stu.parentName+',\n\nHope you are well! Here is the fee summary for '+b.stu.name+' for '+ML+':\n\nGrade: '+b.stu.gradeNum+'  |  Subject: '+(b.stu.subject||'-')+'\nSessions completed: '+b.count+'\n'+rateNote+'\n\n'+sessionLines+'\n\nTotal payable: Rs.'+b.total+'\n\n'+((!b.isMonthly&&b.count>b.stu.basePackage)?'Note: '+(b.count-b.stu.basePackage)+' extra session(s) beyond base package.\n\n':'')+buildPolicyText()+'\n\nThank you!';
      var c=mkCard();
      var t=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}});
      t.appendChild(el('div',{},el('div',{style:{fontWeight:800,fontSize:15,color:'var(--text-primary)',fontWeight:800}},b.stu.name),el('div',{style:{color:'var(--muted)',fontSize:12,marginTop:3}},'Gr.'+b.stu.gradeNum+' · '+(b.stu.subject||'All')+' · '+b.stu.parentName)));
      var ri=el('div',{style:{display:'flex',gap:7,alignItems:'center',flexWrap:'wrap'}});
      ri.appendChild(bdg(b.count+' sessions'));
      ri.appendChild(bdg(b.isMonthly?'Flat Monthly':'Rs.'+b.rate+'/hr','var(--green)','var(--greenL)'));
      if(b.stu.isFamily)ri.appendChild(bdg('Family','var(--gold)','var(--goldL)'));
      if(b.isMonthly)ri.appendChild(bdg('Monthly','#6C3483','#F5EEF8'));
      ri.appendChild(el('span',{style:{fontWeight:900,fontSize:16,color:'var(--accent)'}},'Rs.'+b.total));
      t.appendChild(ri);c.appendChild(t);
      if(!b.isMonthly&&b.count>b.stu.basePackage){c.appendChild(el('div',{style:{marginTop:5,padding:'4px 10px',background:'var(--goldL)',borderRadius:7,fontSize:11,color:'var(--gold)',fontWeight:700}},'Rate upgraded - '+(b.count-b.stu.basePackage)+' extra session(s)'));}
      var br=el('div',{style:{display:'flex',gap:10,marginTop:16,flexWrap:'wrap',alignItems:'center',paddingTop:4}});
      (function(msg_){
        br.appendChild(mkBtn('Preview','btn-ghost','btn-sm',function(){
          var previewBody=el('div',{style:{display:'grid',gap:14}});
          previewBody.appendChild(el('pre',{className:'msg-pre'},msg_));
          var copyBtn=mkBtn('Copy and Close','btn-green','btn-sm',function(){if(navigator.clipboard)navigator.clipboard.writeText(msg_);closeModal();});
          previewBody.appendChild(el('div',{style:{display:'flex',justifyContent:'flex-end'}},copyBtn));
          showModal('Message for '+b.stu.parentName,previewBody);
        }));
        br.appendChild(mkBtn('Copy Message','btn-green','btn-sm',function(){if(navigator.clipboard)navigator.clipboard.writeText(msg_);}));
        var reminderMsg='Dear '+b.stu.parentName+', this is a gentle reminder that payment of Rs.'+b.total+' for '+b.stu.name+'\'s tuition for '+ML+' is overdue. Our payment window is '+(S.policies&&S.policies.paymentDays||3)+' days from the invoice date. Kindly make the payment at the earliest to avoid disruption in sessions. Thank you!';
        br.appendChild(mkBtn('⏰ Reminder','btn-ghost','btn-sm',function(){if(navigator.clipboard)navigator.clipboard.writeText(reminderMsg);showToast('Reminder message copied!');}));
      })(msgText);
      c.appendChild(br);pg.appendChild(c);
    });
    var total=bills.reduce(function(s,b){return s+b.total;},0);
    pg.appendChild(el('div',{style:{background:'var(--accentL)',borderRadius:12,padding:'14px 18px',fontWeight:800,color:'var(--text-primary)',fontSize:14}},'Total Revenue - '+ML+': ',el('span',{style:{color:'var(--accent)',fontSize:18}},'Rs.'+total.toLocaleString('en-IN'))));
  }
  render_();return pg;
}

// RATES
// ── TESTS & MARKS ──
function pgTests(){
  var pg=el('div',{className:'page'});
  var top=el('div',{className:'page-top'});
  top.appendChild(el('h2',{className:'page-title'},'📝 Tests & Marks'));
  top.appendChild(mkBtn('+ New Test','btn-primary','btn-sm',function(){openTestModal();}));
  pg.appendChild(top);

  if(!S.tests||!S.tests.length){
    pg.appendChild(mkCard(el('div',{style:{color:'var(--muted)',textAlign:'center',padding:32,fontSize:14}},'No tests yet. Tap "+ New Test" to create one.')));
    return pg;
  }

  // Sort tests by date descending
  var sorted=[].concat(S.tests).sort(function(a,b){return new Date(b.date)-new Date(a.date);});

  sorted.forEach(function(test,ti){
    var realIdx=S.tests.indexOf(test);
    var c=mkCard();
    // Header
    var hd=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12,flexWrap:'wrap',gap:8}});
    var hl=el('div');
    hl.appendChild(el('div',{style:{fontWeight:800,fontSize:16,color:'var(--text-primary)'}},test.title));
    hl.appendChild(el('div',{style:{color:'var(--muted)',fontSize:12}},new Date(test.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+(test.subject?' · '+test.subject:'')));
    hd.appendChild(hl);
    var hr=el('div',{style:{display:'flex',gap:6}});
    hr.appendChild(bdg('Max: '+test.maxMarks));
    hr.appendChild(bdg('Min Pass: '+test.minMarks,'var(--green)','var(--greenL)'));
    var avg=test.results&&test.results.length?Math.round(test.results.reduce(function(s,r){return s+(Number(r.marks)||0);},0)/test.results.filter(function(r){return r.marks!=='';}).length):null;
    if(avg!=null)hr.appendChild(bdg('Avg: '+avg,'var(--gold)','var(--goldL)'));
    hd.appendChild(hr);
    c.appendChild(hd);

    // Editable student list — tap × to remove a student from this test
    var stuChips=el('div',{style:{display:'flex',flexWrap:'wrap',gap:5,marginBottom:12}});
    var activeIds=(test.studentIds?test.studentIds.slice():S.students.map(function(s){return s.id;}));
    function rebuildChips(){
      stuChips.innerHTML='';
      activeIds.forEach(function(sid){
        var stu=S.students.find(function(s){return s.id===sid;});
        if(!stu)return;
        var chip=el('div',{style:{display:'flex',alignItems:'center',gap:4,background:'var(--accentL)',borderRadius:20,padding:'3px 10px 3px 12px',fontSize:12,fontWeight:600,color:'var(--accent)'}});
        chip.appendChild(document.createTextNode(stu.name));
        var x=el('button',{style:{background:'none',border:'none',cursor:'pointer',color:'var(--accent)',fontWeight:900,fontSize:14,lineHeight:1,padding:'0 0 0 2px'}},'×');
        (function(id){x.addEventListener('click',function(){
          activeIds=activeIds.filter(function(i){return i!==id;});
          S.tests[realIdx]=Object.assign({},S.tests[realIdx],{studentIds:activeIds.slice()});
          scheduleSync();rebuildChips();rebuildGrid();
        });})(sid);
        chip.appendChild(x);stuChips.appendChild(chip);
      });
      // Add student button
      var remaining=S.students.filter(function(s){return activeIds.indexOf(s.id)===-1;});
      if(remaining.length){
        var addSel=el('select',{style:{border:'1.5px dashed var(--border)',borderRadius:20,padding:'3px 10px',fontSize:12,fontFamily:'inherit',background:'var(--input-bg)',color:'var(--muted)',cursor:'pointer'}});
        addSel.appendChild(el('option',{value:''},'+ Add student'));
        remaining.forEach(function(s){addSel.appendChild(el('option',{value:s.id},s.name));});
        addSel.addEventListener('change',function(){
          if(!addSel.value)return;
          activeIds.push(addSel.value);
          S.tests[realIdx]=Object.assign({},S.tests[realIdx],{studentIds:activeIds.slice()});
          scheduleSync();rebuildChips();rebuildGrid();
        });
        stuChips.appendChild(addSel);
      }
    }
    rebuildChips();
    c.appendChild(stuChips);

    // Results table — 5 columns: Student | Marks | % | Pass/Fail | Feedback
    var tbl=el('div',{style:{overflowX:'auto'}});
    var grid;
    function rebuildGrid(){
      tbl.innerHTML='';
      grid=el('div',{style:{display:'grid',gridTemplateColumns:'1fr 80px 64px 72px 1fr 36px',gap:'0',minWidth:420}});
      ['Student','Marks','%','Result','Feedback',''].forEach(function(h){
        grid.appendChild(el('div',{style:{fontWeight:700,fontSize:11,color:'var(--muted)',padding:'6px 8px',borderBottom:'2px solid var(--border)',textTransform:'uppercase',letterSpacing:'.05em'}},h));
      });

      var testStudents=S.students.filter(function(stu){return activeIds.indexOf(stu.id)>-1;});
      testStudents.forEach(function(stu){
        var res=(test.results||[]).find(function(r){return r.studentId===stu.id;})||{studentId:stu.id,marks:'',feedback:''};
        var pass=res.marks!==''&&Number(res.marks)>=Number(test.minMarks);
        var fail=res.marks!==''&&Number(res.marks)<Number(test.minMarks);
        var pct=res.marks!==''?Math.round(Number(res.marks)/Number(test.maxMarks)*100):'';

        // Student name
        grid.appendChild(el('div',{style:{padding:'8px',borderBottom:'1px solid var(--border)',fontWeight:600,color:'var(--text-primary)',fontSize:13,display:'flex',alignItems:'center',color:'var(--text-primary)'}},stu.name));

        // Marks input
        var marksInp=el('input',{type:'number',min:'0',max:test.maxMarks,value:String(res.marks),placeholder:'–',
          style:{width:'100%',border:'1.5px solid var(--border)',borderRadius:7,padding:'6px 6px',fontSize:13,fontFamily:'inherit',textAlign:'center',boxSizing:'border-box',
            background:pass?'var(--greenL)':fail?'var(--accentL)':'#fff',
            color:pass?'var(--green)':fail?'var(--accent)':'var(--text-primary)'}});

        // % cell (updates live)
        var pctCell=el('div',{style:{padding:'8px',borderBottom:'1px solid var(--border)',fontWeight:700,fontSize:12,
          color:pass?'var(--green)':fail?'var(--accent)':'var(--muted)',display:'flex',alignItems:'center',justifyContent:'center'}},
          pct!==''?pct+'%':'–');
        // Pass/fail cell
        var pfCell=el('div',{style:{padding:'8px',borderBottom:'1px solid var(--border)',fontWeight:700,fontSize:12,
          color:pass?'var(--green)':fail?'var(--accent)':'var(--muted)',display:'flex',alignItems:'center'}},
          res.marks===''?'–':pass?'✓ Pass':'✗ Fail');

        (function(stuId,r){
          marksInp.addEventListener('input',function(){
            var v=marksInp.value;
            var results=test.results?[].concat(test.results):[];
            var idx2=results.findIndex(function(x){return x.studentId===stuId;});
            if(idx2>=0)results[idx2]=Object.assign({},results[idx2],{marks:v});
            else results.push({studentId:stuId,marks:v,feedback:r.feedback||''});
            S.tests[realIdx]=Object.assign({},S.tests[realIdx],{results:results});
            scheduleSync();
            var pf=v!==''&&Number(v)>=Number(test.minMarks);
            var ff=v!==''&&Number(v)<Number(test.minMarks);
            var p2=v!==''?Math.round(Number(v)/Number(test.maxMarks)*100):'';
            marksInp.style.background=pf?'var(--greenL)':ff?'var(--accentL)':'#fff';
            marksInp.style.color=pf?'var(--green)':ff?'var(--accent)':'var(--text-primary)';
            pctCell.textContent=p2!==''?p2+'%':'–';
            pctCell.style.color=pf?'var(--green)':ff?'var(--accent)':'var(--muted)';
            pfCell.textContent=v===''?'–':pf?'✓ Pass':'✗ Fail';
            pfCell.style.color=pf?'var(--green)':ff?'var(--accent)':'var(--muted)';
          });
        })(stu.id,res);

        grid.appendChild(el('div',{style:{padding:'6px 4px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center'}},marksInp));
        grid.appendChild(pctCell);
        grid.appendChild(pfCell);

        // Feedback
        var fbInp=el('input',{type:'text',value:res.feedback||'',placeholder:'Add feedback...',
          style:{width:'100%',border:'1.5px solid var(--border)',borderRadius:7,padding:'6px 8px',fontSize:12,fontFamily:'inherit',boxSizing:'border-box'}});
        (function(stuId,r){
          fbInp.addEventListener('input',function(){
            var results=test.results?[].concat(test.results):[];
            var idx2=results.findIndex(function(x){return x.studentId===stuId;});
            if(idx2>=0)results[idx2]=Object.assign({},results[idx2],{feedback:fbInp.value});
            else results.push({studentId:stuId,marks:r.marks||'',feedback:fbInp.value});
            S.tests[realIdx]=Object.assign({},S.tests[realIdx],{results:results});
            scheduleSync();
          });
        })(stu.id,res);
        grid.appendChild(el('div',{style:{padding:'6px 4px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center'}},fbInp));
        // Per-student copy button
        (function(stu2,r2){
          var cpBtn=el('button',{style:{border:'none',background:'none',cursor:'pointer',fontSize:15,padding:'4px',color:'var(--muted)'},title:'Copy this student\'s result'},'📋');
          cpBtn.addEventListener('click',function(){
            var liveT=S.tests[realIdx];var res2=(liveT.results||[]).find(function(x){return x.studentId===stu2.id;})||{marks:'',feedback:''};
            var pct2=res2.marks!==''?Math.round(Number(res2.marks)/Number(liveT.maxMarks)*100)+'%':'–';
            var pass2=res2.marks!==''?(Number(res2.marks)>=Number(liveT.minMarks)?'✓ Pass':'✗ Fail'):'–';
            var txt=liveT.title+' result for '+stu2.name+':\n'
              +'Marks: '+(res2.marks!==''?res2.marks+'/'+liveT.maxMarks:'Not entered')+'\n'
              +'Percentage: '+pct2+'\n'
              +'Result: '+pass2+'\n'
              +(res2.feedback?'Feedback: '+res2.feedback:'');
            if(navigator.clipboard)navigator.clipboard.writeText(txt);
            showToast('Copied '+stu2.name+'\'s result!');
          });
          grid.appendChild(el('div',{style:{padding:'4px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center'}},cpBtn));
        })(stu,res);
      });

      tbl.appendChild(grid);
    }
    rebuildGrid();
    c.appendChild(tbl);

    // Delete test button
    var delRow=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:14,flexWrap:'wrap',gap:8}});

    // Copy all results button
    var copyAllBtn=mkBtn('📋 Copy Results','btn-ghost','btn-sm',function(){
      var liveTest=S.tests[realIdx];
      var testStudents2=S.students.filter(function(stu){
        return !liveTest.studentIds||liveTest.studentIds.indexOf(stu.id)>-1;
      });
      var lines=['📝 '+liveTest.title+' — '+new Date(liveTest.date).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})];
      lines.push('Max Marks: '+liveTest.maxMarks+' | Pass Mark: '+liveTest.minMarks);
      lines.push('─────────────────');
      testStudents2.forEach(function(stu){
        var res=(liveTest.results||[]).find(function(r){return r.studentId===stu.id;})||{marks:'',feedback:''};
        var pct=res.marks!==''?Math.round(Number(res.marks)/Number(liveTest.maxMarks)*100)+'%':'–';
        var pass=res.marks!==''?(Number(res.marks)>=Number(liveTest.minMarks)?'✓ Pass':'✗ Fail'):'–';
        lines.push(stu.name+': '+(res.marks!==''?res.marks+'/'+liveTest.maxMarks:'Not entered')+' ('+pct+') '+pass);
        if(res.feedback)lines.push('   Feedback: '+res.feedback);
      });
      if(navigator.clipboard)navigator.clipboard.writeText(lines.join('\n'));
      showToast('Results copied!');
    });
    delRow.appendChild(copyAllBtn);

    delRow.appendChild(mkBtn('🗑 Delete Test','btn-danger','btn-sm',function(){
      if(!confirm('Delete this test?'))return;
      S.tests.splice(realIdx,1);
      scheduleSync();renderApp();
    }));
    c.appendChild(delRow);
    pg.appendChild(c);
  });
  return pg;
}

      }},stu.name);

  }));

// ── POLICY HELPER — builds policy text for billing messages ──
function buildPolicyText(p){
  p=p||S.policies||{};
  var lines=[];
  if(p.paymentPolicy&&p.paymentPolicy.trim())lines.push(p.paymentPolicy.trim());
  if(p.noShowPolicy&&p.noShowPolicy.trim())lines.push(p.noShowPolicy.trim());
  if(p.cancellationPolicy&&p.cancellationPolicy.trim())lines.push(p.cancellationPolicy.trim());
  if(p.customNote&&p.customNote.trim())lines.push(p.customNote.trim());
  return lines.length?lines.join('\n'):'';
}

function pgPolicies(){
  var local=Object.assign({
    paymentPolicy:'Payment is due within 3 days of this message. Delayed payments will not be accepted.',
    noShowPolicy:'Sessions that are scheduled and blocked but not attended will be charged in full.',
    cancellationPolicy:'Cancellations made less than 24 hours in advance will be charged 50% of the session fee.',
    customNote:''
  },S.policies||{});

    scheduleSync();showToast('Policies saved!');renderApp();
  }));
  pg.appendChild(top);

  var introCard=mkCard();
  introCard.appendChild(el('div',{style:{fontSize:13,color:'var(--muted)',lineHeight:1.7}},'✏️  Every field below is fully editable. Write exactly what you want, or leave any field blank to skip that policy entirely. These appear automatically in your billing messages.'));

  function updatePreview(){
    var txt=buildPolicyText(local);
    previewBox.textContent=txt||'(No policies set — billing messages will have no policy text)';
    previewBox.style.color=txt?'var(--text-primary)':'var(--muted)';
  }

  // Each policy is now its own card, styled the same way as a day on the
  // Schedule page: an orange all-caps label up top (.day-hdr), and the
  // editable content living inside the same light "slot" box used for
  // schedule entries (.slot-pill), so the two pages read as one system.
  function policyField(title,desc,key,placeholder){
    var w=mkCard();
    var hdr=el('div',{className:'day-hdr',style:{justifyContent:'space-between'}});
    hdr.appendChild(el('span',{},title));
    var clearBtn=el('button',{style:{fontSize:11,color:'var(--muted)',background:'none',border:'none',cursor:'pointer',padding:'2px 6px',borderRadius:6,textDecoration:'underline',textTransform:'none',letterSpacing:'normal',fontWeight:600}},'Clear');
    clearBtn.addEventListener('click',function(){ta.value='';local[key]='';updatePreview();});
    hdr.appendChild(clearBtn);
    w.appendChild(hdr);
    w.appendChild(el('div',{style:{fontSize:12,color:'var(--muted)',marginBottom:10}},desc));
    var pillBox=el('div',{className:'slot-pill',style:{padding:0,marginBottom:0}});
    var ta=el('textarea',{rows:2,placeholder:placeholder,
      style:{border:'none',background:'none',padding:'10px 14px',fontSize:13,
        fontFamily:'inherit',width:'100%',outline:'none',resize:'vertical',
        boxSizing:'border-box',lineHeight:1.7,color:'var(--text-primary)',display:'block'}});
    ta.value=local[key]||'';
    ta.addEventListener('input',function(){local[key]=ta.value;updatePreview();});
    pillBox.appendChild(ta);
    w.appendChild(pillBox);
    return w;
  }

  pg.appendChild(policyField(
    '💳 Payment Policy',
    'When payment is due and what happens if it\'s late. Leave blank to include no payment policy.',
    'paymentPolicy',
    'e.g. Payment is due within 3 days of this message. Delayed payments will not be accepted.'
  ));
  pg.appendChild(policyField(
    '🚫 No-Show Policy',
    'What happens if a student misses a scheduled session. Leave blank to skip.',
    'noShowPolicy',
    'e.g. Sessions not attended without prior notice will be charged in full.'
  ));
  pg.appendChild(policyField(
    '⏰ Cancellation Policy',
    'Notice period and charges for late cancellations. Leave blank to skip.',
    'cancellationPolicy',
    'e.g. Cancellations must be made at least 24 hours in advance. Late cancellations will be charged 50%.'
  ));
  pg.appendChild(policyField(
    '📝 Additional Notes',
    'UPI details, refund policy, or anything else you want in every billing message. Leave blank to skip.',
    'customNote',
    'e.g. All payments via UPI to 9876543210@upi. No refunds once sessions are confirmed.'
  ));

  // Preview card — same card+day-hdr+slot-pill pattern as the policy fields above
  var previewCard=mkCard();
  previewCard.appendChild(el('div',{className:'day-hdr'},'👁 Preview'));
  previewCard.appendChild(el('div',{style:{fontSize:12,color:'var(--muted)',marginBottom:10}},'What appears in your billing messages:'));
  var previewPill=el('div',{className:'slot-pill',style:{padding:'12px 14px'}});
  updatePreview();
  previewPill.appendChild(previewBox);
  previewCard.appendChild(previewPill);
  pg.appendChild(previewCard);

  return pg;
}

function pgRates(){
  var local=JSON.parse(JSON.stringify(S.rateTable));

      background:'none',border:'1.5px dashed var(--accent)',borderRadius:7,

    thAdd.appendChild(addTierBtn);hrow.appendChild(thAdd);

    // Body rows

        fontSize:13,fontWeight:700,color:'var(--text-primary)',fontFamily:'inherit',

      nameInp.title='Click to rename';
      (function(idx){nameInp.addEventListener('input',function(){local.bands[idx].label=nameInp.value;});})(bi);
      td0.appendChild(nameInp);tr.appendChild(td0);

    var addBandBtn=el('button',{style:{
      background:'none',border:'1.5px dashed var(--accent)',borderRadius:7,
      padding:'5px 14px',fontSize:12,color:'var(--accent)',cursor:'pointer',
      fontFamily:'inherit',fontWeight:700
    }},'+Add Grade Band');
    addBandBtn.addEventListener('click',function(){

    var wrap=el('div',{style:{overflowX:'auto',borderRadius:12,border:'1px solid var(--border)'}});
    wrap.appendChild(tbl);

  }

  rebuildRateUI();
  pg.appendChild(card);
  return pg;
}

function openMaterialModal(){
  var form={name:'',type:'notes',studentId:(S.students[0]&&S.students[0].id)||'',notes:''};
  var pending=null;
  var stuS=mkSel(form.studentId,[['','Select student...']].concat(S.students.map(function(s){return[s.id,s.name];})),function(v){form.studentId=v;});
  var typS=mkSel(form.type,[['notes','Notes'],['question','Question Paper'],['worksheet','Worksheet'],['resource','Resource']],function(v){form.type=v;});
  var nameI=mkInp('text',form.name,function(v){form.name=v;},'e.g. Chapter 5 Notes');
  var notTA=mkTa(form.notes,function(v){form.notes=v;},3,'Weak areas, topics to cover...');
  var dz=el('div',{className:'drop-zone'},el('div',{style:{fontSize:22,marginBottom:4}},'\uD83D\uDCCE'),el('div',{style:{color:'var(--muted)',fontSize:13}},'Tap to upload PDF or image'),el('div',{style:{color:'var(--muted)',fontSize:11,marginTop:2}},'PDF, PNG, JPG supported'));
  var fi=el('input',{type:'file',accept:'.pdf,.png,.jpg,.jpeg,.webp',style:{display:'none'}});
  fi.addEventListener('change',async function(e){
    var f=e.target.files[0];if(!f)return;
    dz.innerHTML='<div style="font-size:13px;color:var(--muted)">Uploading...</div>';
    // Upload directly to Supabase Storage
    var path=supa.uid+'/'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');
    var result=await supa.uploadFile(f,path);
    if(result.ok){
      pending={name:f.name,fileType:f.type,fileUrl:result.url,storagePath:path,size:f.size};
      if(!nameI.value.trim()){nameI.value=f.name.replace(/\.[^.]+$/,'');}
      dz.classList.add('has-file');
      dz.innerHTML='<div style="font-weight:700;color:var(--green);font-size:13px">'+f.name+' - uploaded!</div>';
    } else {
      dz.innerHTML='<div style="color:#C0392B;font-size:13px">Upload failed: '+result.error+'</div>';
    }

function loadPDFJS(cb){
  if(window.pdfjsLib){cb();return;}
  var s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  s.onload=function(){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    cb();
  };
  document.head.appendChild(s);
}

function setupDraw(canvas,getState){
  var drawing=false,last=null;
  function getPos(e){
    var r=canvas.getBoundingClientRect();
    var sx=canvas.width/r.width,sy=canvas.height/r.height;
    var src=e.touches?e.touches[0]:e;
    return{x:(src.clientX-r.left)*sx,y:(src.clientY-r.top)*sy};
  }
  function draw(from,to){
    var s=getState();var ctx=canvas.getContext('2d');
    ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);
    if(s.tool==='eraser'){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=s.size*5;ctx.strokeStyle='rgba(0,0,0,1)';}
    else if(s.tool==='highlight'){ctx.globalCompositeOperation='source-over';ctx.strokeStyle=s.color+'55';ctx.lineWidth=s.size*5;}
    else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=s.color;ctx.lineWidth=s.size;}
    ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  }
  canvas.addEventListener('mousedown',function(e){e.preventDefault();drawing=true;last=getPos(e);});
  canvas.addEventListener('mousemove',function(e){if(!drawing)return;e.preventDefault();var p=getPos(e);draw(last,p);last=p;});
  canvas.addEventListener('mouseup',function(){drawing=false;});
  canvas.addEventListener('mouseleave',function(){drawing=false;});
  canvas.addEventListener('touchstart',function(e){e.preventDefault();drawing=true;last=getPos(e);},{passive:false});
  canvas.addEventListener('touchmove',function(e){if(!drawing)return;e.preventDefault();var p=getPos(e);draw(last,p);last=p;},{passive:false});
  canvas.addEventListener('touchend',function(){drawing=false;});
}

    }});

    popup.appendChild(inp);popup.appendChild(szSel);popup.appendChild(place);popup.appendChild(cancel);
    wrap.appendChild(popup);
    setTimeout(function(){inp.focus();},50);
  }

  function saveWB(){
    var link=document.createElement('a');
    link.download='whiteboard-'+Date.now()+'.png';
    link.href=cv.toDataURL();link.click();
    showToast('Whiteboard saved!');
  }

  return wrap;
}

function drawWB(ctx,from,to,tool,color,size){
  ctx.beginPath();ctx.moveTo(from.x,from.y);ctx.lineTo(to.x,to.y);
  ctx.globalCompositeOperation='source-over';
  if(tool==='eraser'){ctx.strokeStyle='#FFFFFF';ctx.lineWidth=size*8;}
  else if(tool==='highlight'){ctx.strokeStyle=color+'55';ctx.lineWidth=size*6;}
  else{ctx.strokeStyle=color;ctx.lineWidth=size;}
  ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  ctx.globalCompositeOperation='source-over';
}

// Handle password reset redirect — Supabase puts token in URL hash
function checkResetToken(){
  var hash=window.location.hash;
  if(!hash)return false;
  var params={};
  hash.replace('#','').split('&').forEach(function(p){var kv=p.split('=');params[kv[0]]=decodeURIComponent(kv[1]||'');});
  if(params.type==='recovery'&&params.access_token){
    showResetPasswordPage(params.access_token);
    return true;
  }
  return false;
}

function showResetPasswordPage(accessToken){
  document.getElementById('auth-screen').style.display='flex';
  document.getElementById('main-app').style.display='none';
  var screen=document.getElementById('auth-screen');
  screen.innerHTML='';
  [120,200,300,420,560,700,860].forEach(function(s){screen.appendChild(el('div',{className:'auth-ring',style:{width:s+'px',height:s+'px',top:'50%',left:'50%',transform:'translate(-50%,-50%)'}}));});
  screen.appendChild(el('div',{className:'auth-logo'},'\uD83C\uDF93'));
  screen.appendChild(el('div',{className:'auth-title'},'Set New Password'));
  screen.appendChild(el('div',{className:'auth-sub'},'Choose a new password for your account'));
  var form=el('div',{className:'auth-form'});
  var passVal='',pass2Val='';
  var errDiv=el('div',{style:{color:'#ff6b6b',fontSize:13,textAlign:'center',minHeight:18}});
  var passWrap=el('div',{});
  passWrap.appendChild(el('label',{className:'auth-label'},'New Password'));
  var passInp=el('input',{className:'auth-input',type:'password',placeholder:'At least 6 characters',autocomplete:'new-password'});
  passInp.addEventListener('input',function(e){passVal=e.target.value;});
  passWrap.appendChild(passInp);
  var pass2Wrap=el('div',{});
  pass2Wrap.appendChild(el('label',{className:'auth-label'},'Confirm New Password'));
  var pass2Inp=el('input',{className:'auth-input',type:'password',placeholder:'Repeat new password',autocomplete:'new-password'});
  pass2Inp.addEventListener('input',function(e){pass2Val=e.target.value;});
  pass2Wrap.appendChild(pass2Inp);
  var saveBtn=el('button',{className:'auth-btn'},'Set New Password');
  saveBtn.addEventListener('click',async function(){
    errDiv.textContent='';
    if(passVal.length<6){errDiv.textContent='Password must be at least 6 characters.';return;}
    if(passVal!==pass2Val){errDiv.textContent='Passwords do not match.';return;}
    saveBtn.disabled=true;saveBtn.textContent='Saving...';
    var result=await supa.updatePassword(passVal,accessToken);
    if(result.ok){
      // Clear hash from URL
      history.replaceState(null,null,' ');
      alert('Password updated! Please sign in with your new password.');
      renderAuth();
    } else {
      errDiv.textContent=result.error;
      saveBtn.disabled=false;saveBtn.textContent='Set New Password';
    }
  });
  form.appendChild(passWrap);
  form.appendChild(pass2Wrap);
  form.appendChild(errDiv);
  form.appendChild(saveBtn);
  screen.appendChild(form);
  setTimeout(function(){passInp.focus();},100);
}

  return true;
};
